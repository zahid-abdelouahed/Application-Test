<h2>Films</h2>
<p><a routerLink="/films/nouveau">Ajouter un film</a></p>

@if (erreur()) {
  <p class="erreur">{{ erreur() }}</p>
} 
@if (films(); as liste) {
  @for (f of liste; track f.id) {
    <app-film-card [film]="f" (supprimer)="onSupprimer($event)" />
  }@empty {
    <p>Aucun film enregistré.</p>
  }
}@else {
  <p>Chargement en cours</p>
}
