<article class="carte" [ngClass]="{ ancien: estAncien() }">
  <h3><a [routerLink]="['/films', film().id]">{{ film().titre }}</a></h3>
  <p>{{ film().realisateur }} · {{ film().genre }}</p>
  <p>
    Sortie : {{ film().dateSortie | date:'dd/MM/yyyy' }}
    @if (estAncien()) {
      <span class="etiquette">avant 2000</span>
    }
  </p>
  <button type="button" (click)="onSupprimer()">Supprimer</button>
</article>
